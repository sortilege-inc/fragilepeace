      "text": "Lifeblood of the Earth Kami (Elemental), Jiro's Patience (Fortunist), Kiss of the Pond Woman (Foreign)\n\nJurōjin, guardian of longevity, health, and physical wellbeing, is one of the most sought after of the Seven Fortunes—for whether one is a lord or a peasant, one is sure to pray for health sooner or later. A shugenja can impart spiritual fortification in this Fortune’s name, anointing the body of the target with sacred earth, healing plants such as ginseng or rhubarb, or stranger remedies still. While under the effects of this blessing, a character is much more resistant to poison, disease, and the effects of alcohol—which can be a boon or curse depending on one's goals.\n\nActivation: As a Support action, you may make a TN 1 Theology (earth) check targeting one character at range 0–1.\n\nEffects: If you succeed, you augment your target’s fortitude. The target reduces TN of all checks to resist the effects of poison and disease by 2 (to a minimum of 1). Additionally, the target cannot become intoxicated via imbibing alcohol. This effect persists until the end of the scene.\n\nNew Opportunities\n\n(earth)(op): If you succeed, your target also reduces the TN of all checks to resist mahō, the Defiled terrain quality, and the effects of Otherworldly beings by 2 (to a minimum of 1).\n\n(earth)(op): This effect persists for twenty-four hours instead.\n\n(earth)(op)(op): If you succeed, you also mend your target, removing any poisons currently afflicting them and the Dying condition, and any symptoms of diseases affecting them are suppressed until the end of the scene.",

    {
      "name": "Sight beyond Existence",
      "tag": "Inversion",
      "ring": "void",
      "text": "A meishōdō talisman, not a learned technique — the spirit an ancestor bargained with, and incredibly rare. Held under the Spirit Companion heritage, which lets her perform it though her school does not teach inversions. It does not count against the meishōdō she can sustain under The Way of Names.\n\nThe Void is nonexistence; therefore, within it, all possibilities exist. One who attunes their senses to nonexistence can perceive the other possible realities that ripple outward from each moment of action. The signs often do not come as complete visions, but as brief flashes: hazy vignettes of a world that never was. The rustling of leaves from a tree that has not yet grown, the first laugh shared with a new friend, the scent of blood and burning flesh. However, these rippling potential truths can become intoxicating, drawing an undisciplined mind deeper and deeper into twisted realms of refracted possibility until there is no escape. This is what those who study the Void call the “Lying Darkness”: the trap that awaits all who let their worldly desires guide their ventures into the Void.\n\nActivation: Once per session, immediately after you or another character at range 0–3 performs an action or makes a choice of great consequence in a narrative scene, you may make a TN 2 Theology (void) check targeting that character to peer beyond the lie of time and find another outcome.\n\nEffects: If you succeed, you scry for another outcome and return to the moment before the action was performed. All effects and outcomes stemming from the action are undone, but only you and the target are aware of the reality that no longer is. If you are the target, you may choose the same or a different action or decision. If another character is the target, you may say up to five words to the target before they act or make a decision.\n\nNew Opportunities\n\n(op): If you target another character and you succeed, you may perform an action immediately before the target performs their new action.\n\nMagnitude\n\nMagnitude 1+: You see one possible consequence of the original action or decision that would occur before the end of the scene.\n\nMagnitude 2+: You see one additional possible consequence of the original action or decision that would occur in the next year.\n\nMagnitude 3+: You see one additional possible consequence of the original action or decision that would occur in the next decades, or even further in the future.",

      "text": "When the lord came to see how the smith was proceeding on his sword, he found the smithy a shambles, the river running through the forge, and the smith with his robes tied up around his middle.\n\n“Tsi-san,” said the great lord. “I trust my sword will be ready tomorrow, as we agreed?”\n\n“Of course, great lord,” said the smith, bowing low. “This is only a minor setback.”\n\n– The Trials of Tsi Wenfu, author unknown\n\nThe following apply to a character with the Famously Reliable distinction:\n\n• - Other people have heard of you for your remarkable adherence to your oaths and responsibilities, even over and above most samurai, and they believe it by default unless given evidence to the contrary.\n\n• - When performing a check for which you need to leverage your reputation for keeping your oaths and bargains (such as a Command (earth) check to calm a panicked soldier or a Performance (earth) check to relate a tale that inspires patience), you may reroll up to two dice.",
