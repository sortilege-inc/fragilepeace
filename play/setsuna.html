      "text": "The tale is told of Toritaka Kanoshi, a young samurai of the Falcon Clan, whose father was betrayed and murdered by a family friend. The ghost of the father appeared to the young man and bade him to avenge his murder, but Kanoshi refused to believe that the spirit was truly that of the elder Toritaka. The father’s ghost followed Kanoshi around for years, creating a great commotion that only his son could hear. In the end, nearly driven mad by the torment, Kanoshi finally obeyed the ghost’s wishes and brought the murderer to justice. Satisfied, his father was finally at rest, and he haunted Kanoshi no more.\n\nThe following apply to a character with the Haunted adversity:\n\n• The spirit has their own agenda (determined by the GM), which interferes with yours at inopportune times.\n\n• When you make a check to defy the will of the spirit haunting you (such as a Meditation (void) check to find solace in meditation or a Skulduggery (void) check to perform disreputable acts to survive), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point."
