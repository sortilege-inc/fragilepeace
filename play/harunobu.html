  "ninjo": "He feels constrained by courts and by command. He wants men under his own command, particularly after the debacle with the Lion.\nHe Disagrees with Kamoko but Must Obey\nHe believes his strategies are often more sound, but as long as Kamoko holds authority, he must defer to her final decision—even when he sees a mistake coming.\nHe might occasionally challenge her, but always within respectful bounds—never outright defying her, though the temptation is there.\nHe Watches Kamoko Command and Thinks, ‘That Should Be Me.’\nHe respects Kamoko but knows he is just as capable—perhaps even more so, because he understands both Unicorn and Crab military doctrines.\nThe frustration of seeing an opportunity and being unable to seize it gnaws at him.\nHe Feels Trapped by Loyalty\nIf Kamoko relies on him so much, why isn’t he the one leading the armies?\nHe cannot betray her or act dishonorably, but his own ambition remains unfulfilled.\nHe Sees Court Politics as a Route to Power, But Refuses to Engage\nThe irony is that a politically savvy samurai could maneuver themselves into a greater command, but Harunobu disdains courtly maneuvering—which keeps him locked in Kamoko’s shadow.\nHis refusal to play the political game could be what’s preventing his rise, but he still sees politics as beneath him.",
  "giri": "Utaku Kamoko\nStrategic Commander in Utaku Kamoko’s Forces\nCommands a specialized force within the Unicorn army, focusing on long-term campaign planning and battlefield logistics.\nDirects defensive operations when Kamoko’s usual fast-strike tactics need reinforcement.\nTrusted to lead forces independently when Kamoko must focus elsewhere.\nKamoko’s Personal Advisor\nOne of the few people Kamoko trusts to challenge her ideas without undermining her authority.\nOffers alternative strategies when pure cavalry charges won’t work.\nHelps Kamoko anticipate enemy movements, particularly against foes like the Lion and Scorpion, who rely on deception and layered tactics.\nCrab Clan Liaison\nHandles military negotiations between the Unicorn and Crab, ensuring both sides coordinate effectively in shared operations.\nRespected by Crab commanders, even if they see him as too soft for having returned to the Unicorn.\nActs as a buffer when Unicorn cavalry tactics clash with the Crab’s fortification and attrition warfare strategies.\nEnsures that Unicorn supply lines remain open when dealing with the often blunt and inflexible Hida.",

      "name": "Battle of No Escape",
      "tag": "Shūji",
      "text": "TN 2 if all targets are in Confining or Entangling terrain. Reaches your cohort, or characters who can hear you up to your ranks in Meditation (1).\n\nThere are no conditions of battle simpler or more motivating than “win or die.” A warrior surrounded, with no hope of surrender, is far more likely to be willing to fight to the death, clinging to the feeble chance of survival presented: seize victory or pay the ultimate price. An outnumbered or outmatched commander might intentionally place their troops such that retreat is difficult or impossible, keeping them fighting to the last despite the terrible odds against them.\n\nActivation: Once per scene as a Support action, you may make a TN 5 Command (void) check targeting your cohort or a number of characters who can hear you up to your ranks in Meditation. Reduce the TN of this check to 2 if all targets are in Confining or Entangling terrain.\n\nEffects: If you succeed during a mass battle, your army does not suffer morale collapse if its panic exceeds its discipline, and continues to function normally. This effect persists for one round, plus one round for every three bonus successes. If you succeed during an intrigue, duel, or skirmish, each target ignores the effects of the Compromised condition. This effect persists for one round, plus one round for every two bonus successes.\n\nNew Opportunities\n\n(void)(op)+ (Intrigue, Duel, or Skirmish): Choose one additional target per  spent this way.\n\n(void)(op)(op) (Intrigue, Duel, or Skirmish): If you succeed, each target also ignores the effects of the Incapacitated condition for one round, plus one round for every two bonus successes.",

    {
      "name": "Fortress of Necessity",
      "tag": "Shūji",
      "text": "While some generals favor a barren battlefield where steel can face steel, many others look for places where their forces can draw on cover. These locations offer troops a place to regroup, resupply, or take defensive action, but not all battlefields are so accommodating. In such cases, the commander has their army make their own fortifications.\n\nActivation: As a downtime activity or a Support action during a mass battle, using adequate supplies and a suitable area, you may make a TN 3 Command (earth) check targeting a position you can reach.\n\nEffects: If you succeed, you erect a defensive structure of trenches or short barricades in the area. In a mass battle, this structure is treated as a fortification with difficulty value equal to your ranks in Labor plus your bonus successes, which reduces attrition suffered by the cohort occupying it by 2. In a skirmish, this structure is treated as Obscuring terrain by anyone attacking those inside from outside. This structure is temporary, and degrades completely if left to the elements for more than a few days. It can be maintained with a TN 2 Labor (earth) check as a downtime activity, which might need to be made more frequently in harsh weather conditions such as rain or snow.\n\nNew Opportunities\n\n(earth)(op): When you perform the Reinforce action in this fortification during a mass battle, treat the TN as reduced by 1 (to a minimum of 1).\n\n(earth)(op)(op)+: Add one of the following terrain qualities per (op)(op) spent this way to the area extending from range 1–3 around the building: Dangerous, Entangling, Obscuring, or Recessed. During a mass battle, enemies attacking a cohort in the fortification are treated as being in terrain with the added qualities.",

    {
      "name": "Great Anvil's Measure",
      "tag": "Shūji",
      "text": "A proud leader often draws attention to themselves in battle, and a leader both proud and skilled does so to draw their enemy into attacking them—especially when the enemy would rather attack elsewhere. When the leader’s troops are properly readied, and especially when they are in a highly defensible location, such an attack against them is doomed to fail.\n\nActivation: When you make a check to perform a Guard action in a skirmish (see page 264 of the core rulebook) or a Reinforce action in a mass battle (see page 279 of the core rulebook), you may spend (op) as follows:\n\n(earth)(op)+ (Guard): Choose any number of characters in the scene with focus lower than or equal to your ranks in Performance plus 2 per (op) spent this way. Each chosen character must receive strife equal to your ranks in Performance to perform an Attack or Scheme action targeting any character other than you. This effect persists until the end of your next turn.\n\n(earth)(op)+ (Reinforce): Choose any number of leaders in the enemy army with focus lower than or equal to your ranks in Performance plus 2 per (op) spent this way. The enemy army receives panic equal to your ranks in Performance each time any of those leaders performs an Attack or Scheme action targeting any cohort other than yours. This effect persists until the end of your next turn.",
      "ring": "earth"

    {
      "name": "Righteous Example",
      "tag": "Shūji",
      "text": "A leader’s power exists only in the minds of their followers, yet none can deny the power of an army. In Rokugani warfare, leaders and even commanders often take the field themselves at the start of battle, showing that they shoulder a portion of the risk alongside their warriors. This helps spur their forces on to great victories no warrior alone could achieve.\n\nActivation: As an Attack and Support action during a mass battle, you may make a TN 3 Martial Arts (fire) check targeting an enemy leader’s cohort.\n\nEffects: If you succeed, the enemy army suffers attrition and panic equal to 1 plus your bonus successes. If you succeed, other leaders in your army reduce the TN of their Attack action checks by 1. This effect persists until the end of your next turn. If you fail, reduce the TN of Attack and Scheme action checks targeting your cohort by 1. This effect persists until the end of your next turn.\n\nNew Opportunities\n\n(fire)(op)(op): If you are both the commander and a leader, your army gains 1 momentum point toward its current strategic objective.",
      "ring": "fire"
    },
    {
      "name": "Beseech Akodo's Judgment",
      "tag": "Ritual",
      "text": "In Leadership, Akodo wrote of the importance of terrain in battle, and of knowing how best to use terrain not only to one’s advantage, but to motivate one’s troops. The terrain will guide the actions of the troops as much as the words of the commander, or so Akodo holds, and so a prudent general seeks the terrain that will maintain order in their own soldiers while disrupting that of their enemies.\n\nActivation: Once per game session as a Support action, you may make a TN 3 Tactics (void) check targeting one terrain feature on the battlefield (or one battle zone, if using the rules for battle zones).\n\nEffect: If you succeed, increase your army’s discipline by your glory rank plus your ranks in Command as long as your army has at least one cohort occupying the chosen terrain feature (or in that battle zone, if using the rules for battle zones). This effect persists until your army has no cohort occupying that feature (or zone), or until the end of the scene.\n\nNew Opportunities\n\n(op)+: If you succeed and designate a fortification (or a battle zone with a fortification in it), while your army occupies that fortification, increase that fortification’s difficulty level by 1 per (op) spent this way.\n\n(op)(op)+: Each time your army suffers panic from battle fatigue during this scene, it suffers 1 less per (op) spent this way (to a minimum of 1).",
      "ring": "void"
    },

      "name": "Beseech Hida's Might",
      "tag": "Ritual",
      "text": "Contests of strength were a favorite of the Kami Hida, and even today, spiritualists in Rokugan call upon his blessing when sanctifying an area for ritualized battle. Whether the arena is a circle for sumai or a parting of the battle lines for a field duel, it is important that it be properly respected as a place for champions to take up arms.\n\nActivation: Once per game session as a downtime activity or Support action, you may make a TN 2 Meditation (Fire) check targeting an area encompassing 3 range bands around yourself.\n\nEffects: If you succeed, this area becomes an arena. When a character makes a Martial Arts check in the arena during the event and does not gain strife from the check, that character reduces the TN of their next check by 1 (to a minimum of 1). This effect persists until the end of the next scene.\n\nNew Opportunities\n\n(op): If you succeed, the arena gains the Hallowed (fire) terrain quality until the end of the scene.\n\n(op)+: If you succeed, increase the Endurance and Composure of each character fighting a duel in the arena by 1 per (op) spent this way.\n\n(op)+: Reduce the TN of checks to remove the Bleeding and Dying conditions from characters within the arena by 1 per (op) spent this way (to a minimum of 1).",
      "ring": "fire"

    {
      "name": "Beseech Shiba's Calm",
      "tag": "Ritual",
      "text": "Shiba was a warrior, but he did not love war—despite his vast might, he sought peace over conflict and compromise over bloodshed. Yet war was inescapable in his lifetime, and so he sought Isawa’s spiritual expertise to learn methods for purifying battlefields after times of bloodshed profaned the land. As the War with Fu Leng dragged on, Isawa saw the wisdom in sharing this knowledge, and the rites he taught Shiba for stilling the unsettled spirits of the land after the shedding of blood are used in Rokugan even centuries later.\n\nActivation: Once per game session after participating in a Mass Battle or as a downtime activity, you may make a TN 3 Theology (void) check targeting an area upon which a mass battle was fought earlier that day.\n\nEffects: If you succeed, remove the Defiled terrain quality from the area.\n\nNew Opportunities\n\n(op): If the area gained the Dangerous, Entangling, or Obscuring terrain quality during the battle through supernatural means, remove one or more of those terrain qualities of your choice.\n\n(op)(op): Remove the Imbalanced terrain quality from the area.\n\n(op)(op): Until the end of the game session, non-Tainted beings reduce the TN of Theology checks they make in this area by 1 (to a minimum of 1), and Tainted beings increase the TN of all checks they make in this area by 1.\n\n(op)+: Reduce the TN of any Fitness or Meditation checks that characters in your army need to make at the end of a scene by 1 per (op) spent this way, to a minimum of 1.",

      "text": "Jerking their arm in a sudden motion, the bushi hurls their weapon at the enemy, hoping to take the foe off guard or open a gap in their defenses.\n\nActivation: As an Attack action using one readied weapon in a one-handed grip, you may make a TN 2 Martial Arts check with the appropriate skill for the weapon targeting one character at range 2–3.\n\nEffects: You hurl your weapon at the target. If you succeed, you deal physical damage to the target equal to the weapon’s base damage plus your bonus successes. The weapon lands at range in a direction of your choice from the target if they defend against the damage, or embeds in them if they suffer a critical strike. If you fail, the weapon travels a number of range bands equal to the maximum range of the technique in the direction of the target.\n\nNew Opportunities\n\n(op)+: Treat the maximum range of this technique as 1 higher per (op) spent this way.\n\n(op): Reduce the TN of the next Attack action against the target before the end of your next turn by 1.",

    {
      "name": "Striking as Earth",
      "tag": "Kata",
      "text": "After striking, the bushi roots themself to the ground, hunkering down to make sure their armor takes the brunt of a hit or raising a weapon in a warding position where it can deflect harm without being damaged.\n\nActivation: When you make a Martial Arts [Melee, Ranged, or Unarmed] (earth) check, you may spend (op) in the following way:\n\n(earth)(op)+: Treat your physical resistance as 1 higher per (op) spent this way until the beginning of your next turn.",

    {
      "name": "Striking as Fire",
      "tag": "Kata",
      "text": "Victory cannot be achieved through defense alone, and it is a poor student of the sword who forgets that their most important goal is simple: cut down their enemy. All else fades to the background as the bushi fiercely presses the attack, trying to force an error or open an opportunity to end their foe.\n\nActivation: When you make a Martial Arts [Melee, Ranged, or Unarmed] (fire) Attack action check, you may spend (op) in the following way:\n\n(fire)(op)+: The next time your target suffers a critical strike, increase its severity by 1 per (op) spent this way. This effect persists until the end of your next turn.",

    {
      "name": "Tactical Assessment",
      "tag": "Kata",
      "text": "Akodo’s Leadership and Bayushi’s Lies agree on a few topics, for both leaders were practical to a certain degree, even if Akodo famously scorned many of Bayushi’s methods. As the scholar Hida Fuyuko noted in her revelatory commentary on Leadership’s lessons for commanders on the Kaiu Wall, the most famous meeting of these two minds comes on the matter of preparation: battles are not won in the field, but in the leadup to the conflict. Even in small clashes, the warrior who better understands the terrain, the strength of their own forces, and the composition of the enemy’s troops is usually victorious.\n\nActivation: When you make an Initiative check, you may spend (op) in the following way:\n\n(air)(op): Choose an enemy in the conflict. Learn one of their advantages (of their choice) and their physical or supernatural resistance (your choice).\n\n(earth)(op): Choose a character in the conflict. They do not apply any of their disadvantages to their checks until the end of their first turn.\n\n(water)(op): Choose a piece of terrain in the scene (see Terrain on page 267). Until the start of your first turn, it counts as having the Obscuring quality for Attack action checks targeting you and your allies.\n\n(fire)(op): Choose a character in the conflict and one of their advantages you know. Until the end of their first turn, they apply that advantage to all of their checks.",

      "text": "The bushi draws a deep breath, exhaling as they rise to their feet. Pain can be conquered as long as there is a duty to be done. Honor is stronger than steel, it is said, and it falls to the samurai to prove it.\n\nActivation: Once per scene, as a Support action, you may spend 1 Void point to recover.\n\nEffects: Remove fatigue equal to your honor rank.",

      "name": "The Patient Viper",
      "tag": "Ninjutsu",
      "text": "Sometimes, the best way to approach a target is to stand still. Shinobi often lie in wait for hours or even days, patiently maintaining their position to ensure that they strike well when their foe arrives.\n\nActivation: As a downtime activity, you may make a TN 4 Fitness (earth) check targeting your cohort (if you are currently the leader of a cohort) or yourself and a number of other characters up to your ranks in Command (in any other scene) who are within Dangerous, Entangling, or Obscuring terrain.\n\nEffects: If you succeed, all targets become hidden and are not noticed by characters with vigilance lower than or equal to your Earth Ring plus your bonus successes. These hidden characters cannot be the target of Attack actions. This effect persists until the end of your next turn, or until any target you have hidden performs an Attack or Movement action.\n\nNew Opportunities\n\n(earth)(op)+: This effect persists for one additional round per (op) spent this way.\n\n(earth)(op)+: Reduce the TN of the first Attack action check one of your targets makes against another character in the terrain in which your forces are hidden by 1 per (op) spent this way.",

  "peculiarities": [
    {
      "name": "Bishamon’s Blessing",
      "tag": "Distinction",
      "ring": "water",
      "text": "The walls of many an inn in Rokugan ring with a wellknown song, “The Badger and the Stone,” a ballad that tells the tale of an ancient battle far in the Great Wall of the North Mountains.\n\nThe story goes that a vicious tribe of Yobanjin were surging through a mountain pass, only to be stopped by a single nameless samurai of the Badger Clan, who called upon the Fortune Bishamon for aid and lifted an immense stone, hurling it down the walls of the pass. The mighty stone triggered an avalanche, which crushed the foreign invaders and sealed the pass forever.\n\nThe following apply to a character with the Bishamon’s Blessing distinction:\n\n• You recover from physical exhaustion twice as quickly as others.\n\n• When performing a check for which the favor of this Fortune is a benefit (such as a Fitness (water) check to recover from exhaustion or a Martial Arts [Unarmed] (water) check to subdue a foe), you may reroll up to two dice.",

    {
      "name": "Indomitable Will",
      "tag": "Distinction",
      "ring": "earth",
      "text": "The travelers cowered as the ghost, shrieking hideously, drifted toward them from the ruins of the ancient temple where they’d chosen to make camp for the night. The moonlight lent the spirit an unearthly glow, and its howls echoed in their ears as it grew ever closer.\n\n“It is a gaki—a hungry ghost!” shouted Yogo Kikuyo, stepping between the travelers and the spirit as she rummaged through her bag.\n\n“Are you not afraid?” shouted one of her companions, as he clutched at her waist, trying to draw her back from the wailing apparition.\n\n“I am not,” Kikuyo said, as she drew a paper ofuda talisman, inscribed with blessings, from her satchel. “I am familiar with its sort.”\n\nThe following apply to a character with the Indomitable Will distinction:\n\n• You can always choose to stand your ground, even when faced with untenable odds, supernatural terrors, or sorcerous powers that bend the minds of lesser souls.\n\n• When performing a check for which you need to keep your cool when dealing with danger (such as a Command (earth) check to give orders under pressure or a Meditation (earth) check to resist the effects of fear), you may reroll up to two dice.",
      "reroll": {
        "kind": "advantage",

    {
      "name": "Glorious Deeds",
      "tag": "Passion",
      "ring": "fire",
      "text": "“Even should a samurai evade death on the battlefield and survive to see their great-grandchildren come of age, one day they will pass. Such is the way of mortals. But the stories that people tell of that samurai—those may live forever.” The Ikoma historian gave his sibling a shrewd look.\n\n“But you did not come to listen to the lectures I have for students, I suspect. You want to be the subject of my next lecture. Tell me of your accomplishments, and I will make sure they are recorded in the family histories.”\n\nWith that prompting, the eager bushi launched into a story about their efforts in the recent conflict, and they were not silent until late into the night.\n\nThe following apply to a character with the Glorious Deeds passion:\n\n• You find risking your life to be a simple matter, as long as there is a witness to remember your bravery. No threat or challenge deters you if you might be remembered for it, making even the most daunting tasks easy ones for which to prepare.\n\n• After performing a check to improve your reputation or gain fame as a great samurai (such as a Performance (fire) check to impress a court with your new melody, or a Tactics (fire) check to execute a daring raid on the enemy), you remove 3 strife.",
      "strife": -3

    {

      "tag": "Adversity",
      "ring": "fire",
      "text": "“Study is like sailing against a current; a boat must forge ahead, lest it be swept downstream. But those without a boat must go where the current takes them; not all people are made to be sailors.”\n\n– Analects of Nabeshima\n\nThe following apply to a character with the Fukurokujin’s Curse adversity:\n\n• It takes you twice as long to gain a grasp of an academic field of study as it does another character.\n\n• When you make a check to extrapolate how to do something in a field of study (such as a Medicine (fire) check to guess how to treat an unfamiliar aliment based on its symptoms or a Survival (fire) check to guess an unknown creature’s qualities based on its physiology), you must choose and reroll two dice containing (su) or (ex). After resolving the check, if you failed, you gain 1 Void point.",

    {
      "name": "Belligerent",
      "tag": "Anxiety",
      "ring": "earth",
      "text": "“Matsu-san, no! We are guests here.” The courtier looked on in horror as Matsu Chiyoko gripped her blade as if to draw it.\n\n“They should have remembered their duties as hosts, then, instead of insulting me,” Chiyoko retorted, before returning her attention to the Crane samurai in front of her. “I challenge you, for your insult! If you would belittle my courage, I dare you to prove your own.”\n\nEffects: The following apply to a character with the Belligerent anxiety:\n\n• You find it nearly impossible to keep your cool when provoked, and may even look for an excuse to fight with people you consider deserving of a good thrashing. Delicate social situations can easily spiral out of control when you suspect the other party of giving offense.\n\n• After performing a check to respond to provocation without resorting to violence or threats (such as a Performance (earth) check to calmly sing a song that was originally composed to paint your lineage in an unflattering light or a Meditation (earth) check to stay in formation when you spot a rival across the battlefield), you receive 3 strife. If this is the first time this has occurred this scene, gain 1 Void point.",
